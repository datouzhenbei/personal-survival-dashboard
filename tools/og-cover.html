<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>og-cover</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #0a0a0c;
    color: #f2f2f5;
    font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding: 58px 68px;
    display: flex;
    flex-direction: column;
    position: relative;
  }
  .glow {
    position: absolute; inset: 0;
    background:
      radial-gradient(720px 380px at 88% -8%, rgba(245,166,35,0.20), transparent 62%),
      radial-gradient(560px 320px at 6% 104%, rgba(94,120,255,0.14), transparent 66%);
  }
  .inner { position: relative; display: flex; flex-direction: column; height: 100%; }

  .brand { display: flex; align-items: center; gap: 14px; }
  .brand .dot {
    width: 30px; height: 30px; border-radius: 50%;
    background: conic-gradient(#f5a623 0 46%, #2a2a31 46% 100%);
    box-shadow: 0 0 0 6px rgba(245,166,35,0.10);
    position: relative;
  }
  .brand .dot::after {
    content: ''; position: absolute; inset: 8px; border-radius: 50%; background: #0a0a0c;
  }
  .brand b { font-size: 27px; font-weight: 650; letter-spacing: .04em; }
  .brand span { font-size: 16px; color: #8b8b95; margin-left: 2px; }

  h1 {
    font-size: 72px; font-weight: 700; line-height: 1.12;
    letter-spacing: -0.02em; margin-top: 46px;
  }
  h1 em { font-style: normal; color: #f5a623; }

  .sub { font-size: 22px; color: #a2a2ad; margin-top: 20px; line-height: 1.5; }

  .cards { display: flex; gap: 20px; margin-top: auto; }
  .card {
    flex: 1;
    background: #14141a;
    border: 1px solid #26262e;
    border-radius: 18px;
    padding: 22px 26px 24px;
  }
  .card .label { font-size: 17px; color: #9a9aa5; }
  .card .num {
    display: flex; align-items: baseline; gap: 10px; margin-top: 10px;
    font-size: 56px; font-weight: 700; letter-spacing: -0.02em; line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .card .num small { font-size: 24px; font-weight: 500; color: #c9c9d2; }
  .card.a .num { color: #f5a623; }
  .card.b .num { color: #4ecb8f; }
  .card .note { font-size: 15px; color: #7d7d88; margin-top: 10px; }

  .foot { margin-top: 22px; font-size: 16px; color: #6f6f7a; display: flex; gap: 14px; align-items: center; }
  .foot i { width: 3px; height: 3px; border-radius: 50%; background: #45454f; display: inline-block; }
  .foot b { color: #9a9aa5; font-weight: 500; }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="inner">
    <div class="brand">
      <span class="dot"></span>
      <b>人生余额</b>
      <span>时间 · 存款 · 都不用上传</span>
    </div>

    <h1>我还能活多久，<br>钱还能<em>撑多久</em>？</h1>
    <p class="sub">填一个出生日期，看看还剩多少天；填一笔存款，看看还能撑多久。</p>

    <div class="cards">
      <div class="card a">
        <div class="label">寿命余额</div>
        <div class="num">15,817<small>天</small></div>
        <div class="note">已度过 45.9% · 按预期寿命线性换算</div>
      </div>
      <div class="card b">
        <div class="label">存款还能撑</div>
        <div class="num">59<small>个月</small></div>
        <div class="note">4 年 11 个月 · 已计入通胀</div>
      </div>
    </div>

    <div class="foot">
      <b>纯前端 · 零后端</b><i></i><span>数据只存在你自己的浏览器里</span><i></i><span>datouzhenbei.github.io/personal-survival-dashboard</span>
    </div>
  </div>
</body>
</html>
