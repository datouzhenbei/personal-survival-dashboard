<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="个人生存看板：本地计算剩余生命时间与存款可支撑时长，数据仅保存在浏览器，不上传服务器。">
  <meta name="color-scheme" content="dark">
  <title>生存看板 · 本地计算 · 数据不上传</title>
  <!-- 内联 favicon（data URI），避免产生额外网络请求 -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='10' fill='%23f5a623'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <!-- 顶栏：标题 + 数据状态 + 导入/导出/清空 -->
  <header class="site-header">
    <div class="container header-inner">
      <div class="brand">
        <h1>生存看板</h1>
        <p>本地计算 · 数据不上传</p>
      </div>
      <div class="header-actions">
        <span class="save-status" id="save-status" title="本机 localStorage 数据状态">
          <span class="dot" aria-label="未保存"></span>
          <span class="save-status__text">尚未保存</span>
        </span>

        <button type="button" class="icon-btn" id="btn-export" aria-label="导出 JSON 备份" title="导出 JSON 备份">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
        </button>

        <button type="button" class="icon-btn" id="btn-import" aria-label="导入 JSON 备份" title="导入 JSON 备份">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="17 8 12 3 7 8"/>
            <line x1="12" y1="3" x2="12" y2="15"/>
          </svg>
        </button>

        <button type="button" class="icon-btn" id="btn-clear" aria-label="清空全部数据" title="清空全部数据">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
            <polyline points="3 6 5 6 21 6"/>
            <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
            <path d="M10 11v6M14 11v6"/>
            <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <main class="container">
    <!-- 首屏总览：剩余生命天数 · 存款可支撑月数（JS 渲染） -->
    <section id="hero" class="hero-grid" aria-label="核心数据总览"></section>

    <!-- 生命倒计时模块（JS 渲染） -->
    <section id="life-module" class="module" aria-label="生命倒计时"></section>

    <!-- 存款生存计算器模块（JS 渲染） -->
    <section id="savings-module" class="module" aria-label="存款生存计算器"></section>

    <!-- 设置抽屉（JS 渲染） -->
    <section id="settings-module" aria-label="设置与偏好"></section>
  </main>

  <!-- 页脚：免责声明全文由 JS 从 Config.DISCLAIMER 填充 -->
  <footer class="site-footer">
    <div class="container">
      <p id="footer-disclaimer"></p>
      <p>所有数据仅保存在本设备的浏览器 localStorage 中，清除浏览器数据将丢失。</p>
      <div class="footer-meta">
        <span id="app-version"></span>
        <a href="https://github.com/datouzhenbei/personal-survival-dashboard" id="repo-link" class="footer-link" target="_blank" rel="noopener noreferrer">GitHub 仓库</a>
      </div>
    </div>
  </footer>

  <!-- 自定义确认模态挂载点（禁用原生 confirm/alert） -->
  <div id="modal-root"></div>
  <!-- Toast 轻提示挂载点 -->
  <div id="toast-root" class="toast-root" aria-live="polite"></div>

  <!-- 隐藏的导入文件选择器 -->
  <input type="file" id="import-file" accept="application/json,.json" hidden>

  <script type="module" src="./js/ui/app.js"></script>
</body>
</html>
