<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="人生余额：算算你还能活多久、钱还能撑多久。全部在本机计算，数据不上传服务器。">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0a0a0c">
  <title>人生余额 · 我还能活多久，钱还能撑多久</title>

  <!-- 社交分享卡片（微信 / QQ / X / Facebook 等抓取 og:* 生成链接预览卡）
       注意：og:image 必须是绝对地址，聊天工具才能抓到图。 -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="人生余额">
  <meta property="og:title" content="人生余额 · 我还能活多久，钱还能撑多久">
  <meta property="og:description" content="填一个出生日期，看看还剩多少天；填一笔存款，看看还能撑多久。全部在本机计算，数据不上传。">
  <meta property="og:url" content="https://datouzhenbei.github.io/personal-survival-dashboard/">
  <meta property="og:image" content="https://datouzhenbei.github.io/personal-survival-dashboard/assets/og-cover.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="人生余额：我还能活多久 · 钱还能撑多久">
  <meta property="og:locale" content="zh_CN">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="人生余额 · 我还能活多久，钱还能撑多久">
  <meta name="twitter:description" content="填一个出生日期，看看还剩多少天；填一笔存款，看看还能撑多久。全部在本机计算。">
  <meta name="twitter:image" content="https://datouzhenbei.github.io/personal-survival-dashboard/assets/og-cover.png">
  <!-- 内联 favicon（data URI），避免产生额外网络请求 -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='10' fill='%23f5a623'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <!-- 顶栏：标题 + 数据状态 + 导入/导出/清空 -->
  <header class="site-header">
    <div class="container header-inner">
      <div class="brand">
        <h1>人生余额</h1>
        <p>时间 · 存款 · 都不用上传</p>
      </div>
      <div class="header-actions">
        <span class="save-status" id="save-status" title="本机 localStorage 数据状态">
          <span class="dot" aria-label="未保存"></span>
          <span class="save-status__text">尚未保存</span>
        </span>

        <button type="button" class="icon-btn" id="btn-export" aria-label="导出 JSON 备份" title="导出 JSON 备份">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
        </button>

        <button type="button" class="icon-btn" id="btn-import" aria-label="导入 JSON 备份" title="导入 JSON 备份">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="17 8 12 3 7 8"/>
            <line x1="12" y1="3" x2="12" y2="15"/>
          </svg>
        </button>

        <button type="button" class="icon-btn" id="btn-clear" aria-label="清空全部数据" title="清空全部数据">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
            <polyline points="3 6 5 6 21 6"/>
            <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
            <path d="M10 11v6M14 11v6"/>
            <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <!-- main 在宽屏下同时充当「整页统一栅格」：hero / 生命 / 存款三个 section 用
       display:contents 让各自的卡片直接落进同一套两列网格，保证左右边界严格对齐。 -->
  <main class="container">
    <!-- 首屏两张卡：我还能活多久 / 钱还能撑多久（JS 渲染） -->
    <section id="hero" class="hero-grid" aria-label="核心数据总览"></section>

    <!-- 生命模块：进度环 + 参数（JS 渲染，一个 section 只出一张卡） -->
    <section id="life-module" class="module" aria-label="生命倒计时"></section>

    <!-- 存款模块：参数卡 + 明细条（JS 渲染） -->
    <section id="savings-module" class="module" aria-label="存款生存计算器"></section>

    <!-- 备份提醒：只在需要提醒时才有内容，平时整块隐藏（JS 渲染） -->
    <section id="data-module" class="module" aria-label="备份提醒" hidden></section>

    <!-- 设置抽屉（含数据安全与备份，JS 渲染） -->
    <section id="settings-module" aria-label="设置与偏好"></section>
  </main>

  <!-- 页脚：压成两行（免责声明全文由 JS 从 Config.DISCLAIMER 填充） -->
  <footer class="site-footer">
    <div class="container">
      <p id="footer-disclaimer"></p>
      <div class="footer-meta">
        <span>数据只在本机，清浏览器数据会丢</span>
        <span id="app-version"></span>
        <a href="https://github.com/datouzhenbei/personal-survival-dashboard" id="repo-link" class="footer-link" target="_blank" rel="noopener noreferrer">GitHub 仓库</a>
      </div>
    </div>
  </footer>

  <!-- 自定义确认模态挂载点（禁用原生 confirm/alert） -->
  <div id="modal-root"></div>
  <!-- Toast 轻提示挂载点 -->
  <div id="toast-root" class="toast-root" aria-live="polite"></div>

  <!-- 隐藏的导入文件选择器 -->
  <input type="file" id="import-file" accept="application/json,.json" hidden>

  <script type="module" src="./js/ui/app.js"></script>
</body>
</html>
